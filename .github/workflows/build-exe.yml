name: Build W3X EXE

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "W3XUnpacker" \
            --add-data "mpyq.py;." \
            --add-data "内置技能名.json;." \
            --hidden-import mpyq \
            unpack_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: W3XUnpacker-exe
          path: dist/W3XUnpacker.exe